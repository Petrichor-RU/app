product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.ktor.client.core
  - $libs.kotlinx.serialization.json
  - $libs.compass.geolocation

dependencies@android:
  - $compose.uiTooling
  - $libs.compass.geolocation.mobile
  - $libs.ktor.client.cio

dependencies@ios:
  - $libs.compass.geolocation.mobile
  - $libs.ktor.client.darwin

dependencies@jvm:
  - $libs.ktor.client.cio

dependencies@wasmJs:
  - $libs.compass.geolocation.browser

settings:
  compose:
    enabled: true
    resources:
      packageName: nl.petrichor.app.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
