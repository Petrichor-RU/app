product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $kotlin.serialization.json
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.ktor.client.core
  - $libs.kotlinx.datetime
  - $libs.compass.geolocation
  - $libs.material.symbols
  - $libs.androidx.datastore.preferences.core
  - $libs.calvin.reorderable
  - $libs.androidx.room.runtime
  - $libs.imagepickerkmp
  - $libs.kizitonwose.calendar
  - $libs.kotlinx.coroutines.test
  - $kotlin.serialization.json

dependencies@android:
  - $compose.uiTooling
  - $libs.androidx.activity.compose
  - $libs.compass.geolocation.mobile
  - $libs.ktor.client.cio
  - $libs.sqlite.bundled

dependencies@ios:
  - $libs.compass.geolocation.mobile
  - $libs.ktor.client.darwin
  - $libs.sqlite.bundled

dependencies@jvm:
  - $libs.ktor.client.cio
  - $compose.uiTest
  - $libs.skiko.awt.runtime.linux.x64
  - $libs.sqlite.bundled

dependencies@wasmJs:
  - $libs.ktor.client.js
  - $libs.compass.geolocation.browser
  - $libs.sqlite.web


settings:
  kotlin:
    serialization: enabled
    ksp:
      processors:
              - $libs.androidx.room.compiler
  compose:
    enabled: true
    resources:
      packageName: nl.petrichor.app.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  
